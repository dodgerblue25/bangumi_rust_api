[package]
name = "bgm_api"
version = "0.1.0"
edition = "2024"
description = "A Rust client implementation for Bangumi API by GPT5.6-luna "
license = "AGPL-3.0-only"

[dependencies]
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
